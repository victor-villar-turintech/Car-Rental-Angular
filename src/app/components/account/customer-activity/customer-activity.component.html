<section class="account-page container"><div class="account-header"><div><span>Activity</span><h1>My activity</h1><p>Recent account, booking, payment and rewards events.</p></div><a class="btn btn-outline-primary" routerLink="/account">Back to account</a></div><div class="activity-list"><article class="activity-card" *ngFor="let item of activity"><strong>{{ item.activityType }}</strong><p>{{ item.message }}</p><small>{{ item.createdAt | date:'medium' }}</small></article><div class="empty-state" *ngIf="activity.length === 0">No activity yet.</div></div></section>
