<div class="filter-card">
  <div class="filter-header">
    <span>Filters</span>
    <strong>Refine search</strong>
  </div>

  <div class="form-group">
    <label for="brandFilter">Brand</label>
    <select id="brandFilter" class="form-control" [(ngModel)]="brandIdFilter">
      <option [ngValue]="undefined">All brands</option>
      <option *ngFor="let brand of brands" [ngValue]="brand.brandId">{{ brand.brandName }}</option>
    </select>
  </div>

  <div class="form-group">
    <label for="colorFilter">Colour</label>
    <select id="colorFilter" class="form-control" [(ngModel)]="colorIdFilter">
      <option [ngValue]="undefined">All colours</option>
      <option *ngFor="let color of colors" [ngValue]="color.colorId">{{ color.colorName }}</option>
    </select>
  </div>

  <div class="filter-actions">
    <button class="btn btn-primary" type="button" (click)="applyFilters()">Apply filters</button>
    <button class="btn btn-outline-secondary" type="button" (click)="clearFilters()">Clear filters</button>
  </div>
</div>
