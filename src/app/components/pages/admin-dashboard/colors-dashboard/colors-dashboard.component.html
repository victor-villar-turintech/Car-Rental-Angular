<div class="admin-panel-card">
  <div class="admin-panel-header">
    <div>
      <span>Colours</span>
      <h1>Colour management</h1>
      <p>Create, update and delete colour filters from the local mock database.</p>
    </div>

    <div class="admin-actions">
      <button routerLink="/admin/colors/add" type="button" class="btn btn-primary">Add colour</button>
      <button routerLink="/cars" type="button" class="btn btn-outline-secondary">Browse catalogue</button>
    </div>
  </div>

  <div *ngIf="!dataLoaded" class="admin-note">Loading colours...</div>

  <div *ngIf="dataLoaded && colors.length === 0" class="admin-note">No colours available.</div>

  <div *ngIf="dataLoaded && colors.length > 0" class="table-responsive admin-table-wrap">
    <table class="table align-middle admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Colour</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let color of colors">
          <td>{{ color.colorId }}</td>
          <td>{{ color.colorName }}</td>
          <td class="text-end action-cell">
            <button [routerLink]="['/admin/colors/edit', color.colorId]" type="button" class="btn btn-sm btn-outline-info">Edit</button>
            <button (click)="deleteColor(color)" type="button" class="btn btn-sm btn-outline-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
