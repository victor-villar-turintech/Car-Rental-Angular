<section class="payment-page">
  <div class="container">
    <div class="payment-card" *ngIf="!paymentCompleted">
      <div class="payment-copy">
        <span>Secure demo checkout</span>
        <h1>Confirm payment</h1>
        <p>This is a local demo payment form. Use the prefilled card number to complete the sample rental flow.</p>
        <div class="demo-card-number">4111 1111 1111 1111</div>
      </div>

      <form class="payment-form" (ngSubmit)="rentACar()">
        <div class="form-group">
          <label for="nameOnTheCard">Name on card</label>
          <input id="nameOnTheCard" name="nameOnTheCard" class="form-control" [(ngModel)]="nameOnTheCard" />
        </div>
        <div class="form-group">
          <label for="cardNumber">Card number</label>
          <input id="cardNumber" name="cardNumber" class="form-control" [(ngModel)]="cardNumber" />
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="cardExpiration">Expiry</label>
            <input id="cardExpiration" name="cardExpiration" class="form-control" [(ngModel)]="cardExpiration" />
          </div>
          <div class="form-group col-md-6">
            <label for="cardCvv">CVV</label>
            <input id="cardCvv" name="cardCvv" class="form-control" [(ngModel)]="cardCvv" />
          </div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Confirm rental</button>
      </form>
    </div>

    <div class="payment-success" *ngIf="paymentCompleted">
      <span>Confirmed</span>
      <h1>Your rental is booked</h1>
      <p>The demo rental flow has been completed successfully.</p>
      <button class="btn btn-primary btn-lg" type="button" (click)="backToCars()">Back to cars</button>
    </div>
  </div>
</section>
