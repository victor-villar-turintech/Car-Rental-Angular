<section class="auth-page">
  <form class="auth-card" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
    <span class="eyebrow">Customer account</span>
    <h1>Sign in</h1>
    <p>Use a local demo account to pre-fill bookings and view your rental history.</p>

    <app-validation-summary [form]="loginForm"></app-validation-summary>

    <label for="email">Email</label>
    <input id="email" class="form-control" type="email" formControlName="email" autocomplete="email">
    <app-form-error [control]="f.email" label="Email"></app-form-error>

    <label for="password">Password</label>
    <input id="password" class="form-control" type="password" formControlName="password" autocomplete="current-password">
    <app-form-error [control]="f.password" label="Password"></app-form-error>

    <button class="btn btn-primary w-100 mt-3" type="submit">Sign in</button>
    <p class="auth-link">No account yet? <a routerLink="/register">Create one</a></p>
  </form>
</section>
