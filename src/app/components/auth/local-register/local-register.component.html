<section class="auth-page">
  <form class="auth-card" [formGroup]="registerForm" (ngSubmit)="register()" novalidate>
    <span class="eyebrow">Customer account</span>
    <h1>Create account</h1>
    <p>This creates a localStorage demo account for customer bookings and receipts.</p>

    <app-validation-summary [form]="registerForm"></app-validation-summary>

    <div class="form-grid">
      <div>
        <label for="firstName">First name</label>
        <input id="firstName" class="form-control" formControlName="firstName" autocomplete="given-name">
        <app-form-error [control]="f.firstName" label="First name"></app-form-error>
      </div>
      <div>
        <label for="lastName">Last name</label>
        <input id="lastName" class="form-control" formControlName="lastName" autocomplete="family-name">
        <app-form-error [control]="f.lastName" label="Last name"></app-form-error>
      </div>
    </div>

    <label for="email">Email</label>
    <input id="email" class="form-control" type="email" formControlName="email" autocomplete="email">
    <app-form-error [control]="f.email" label="Email"></app-form-error>

    <label for="phone">Phone</label>
    <input id="phone" class="form-control" formControlName="phone" autocomplete="tel">
    <app-form-error [control]="f.phone" label="Phone"></app-form-error>

    <div class="form-grid">
      <div>
        <label for="password">Password</label>
        <input id="password" class="form-control" type="password" formControlName="password" autocomplete="new-password">
        <app-form-error [control]="f.password" label="Password"></app-form-error>
      </div>
      <div>
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" class="form-control" type="password" formControlName="confirmPassword" autocomplete="new-password">
        <app-form-error [control]="f.confirmPassword" label="Confirm password"></app-form-error>
      </div>
    </div>

    <button class="btn btn-primary w-100 mt-3" type="submit">Create account</button>
    <p class="auth-link">Already registered? <a routerLink="/login">Sign in</a></p>
  </form>
</section>
